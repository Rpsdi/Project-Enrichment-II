<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dc Mon System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray login-body">

    <div class="login-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Login Sistem NOC</h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="inUsername" placeholder="Masukkan username">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="inPassword" placeholder="Masukkan password">
        </div>
        
        <button id="btnLogin" class="btn-primary" style="width: 100%; margin-top: 10px;">Masuk</button>
        <p id="errorMsg" style="color: red; text-align: center; margin-top: 15px; display: none;">Username atau Password salah!</p>
    </div>

    <script>
        document.getElementById('btnLogin').addEventListener('click', () => {
            const user = document.getElementById('inUsername').value.trim().toLowerCase();
            const pass = document.getElementById('inPassword').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            let loginData = null;

            if (user === 'matthew' && pass === 'operator1') {
                loginData = { name: 'Matthew', id: '1' };
            } else if (user === 'delbert' && pass === 'operator2') {
                loginData = { name: 'Delbert', id: '2' };
            }

            if (loginData) {
                // Simpan data user ke memori sesi browser
                sessionStorage.setItem('operatorAktif', JSON.stringify(loginData));
                window.location.href = 'index.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
